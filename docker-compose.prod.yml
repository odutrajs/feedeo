services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: feedeo
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: feedeo
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U feedeo"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: ghcr.io/odutrajs/feedeo-backend:latest
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg2://feedeo:${DB_PASSWORD}@postgres:5432/feedeo
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: feedeo-media
      MINIO_SECURE: "false"
      SCHEDULER_URL: http://scheduler:8090
      JWT_SECRET: ${JWT_SECRET}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY}
      ELEVENLABS_VOICE_ID: ${ELEVENLABS_VOICE_ID:-21m00Tcm4TlvDq8ikWAM}
      ELEVENLABS_MODEL_ID: ${ELEVENLABS_MODEL_ID:-eleven_multilingual_v2}
      FAL_KEY: ${FAL_KEY}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      STRIPE_PRICE_CREATOR: ${STRIPE_PRICE_CREATOR}
      STRIPE_PRICE_PRO: ${STRIPE_PRICE_PRO}
      STRIPE_PRICE_STUDIO: ${STRIPE_PRICE_STUDIO}
      INSTAGRAM_APP_ID: ${INSTAGRAM_APP_ID}
      INSTAGRAM_APP_SECRET: ${INSTAGRAM_APP_SECRET}
      INSTAGRAM_REDIRECT_URI: https://feedeo.com.br/api/auth/instagram/callback
      PUBLIC_BASE_URL: https://feedeo.com.br
      FRONTEND_URL: https://feedeo.com.br
      LOG_LEVEL: INFO
      STORAGE_DIR: /data/storage
    volumes:
      - storage-data:/data/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  worker:
    image: ghcr.io/odutrajs/feedeo-backend:latest
    restart: unless-stopped
    command: ["python", "worker.py"]
    environment:
      DATABASE_URL: postgresql+psycopg2://feedeo:${DB_PASSWORD}@postgres:5432/feedeo
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: feedeo-media
      MINIO_SECURE: "false"
      SCHEDULER_URL: http://scheduler:8090
      JWT_SECRET: ${JWT_SECRET}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY}
      ELEVENLABS_VOICE_ID: ${ELEVENLABS_VOICE_ID:-21m00Tcm4TlvDq8ikWAM}
      ELEVENLABS_MODEL_ID: ${ELEVENLABS_MODEL_ID:-eleven_multilingual_v2}
      FAL_KEY: ${FAL_KEY}
      LOG_LEVEL: INFO
      STORAGE_DIR: /data/storage
    volumes:
      - storage-data:/data/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  scheduler:
    image: ghcr.io/odutrajs/feedeo-scheduler:latest
    restart: unless-stopped
    environment:
      HTTP_ADDR: ":8090"
      REDIS_ADDR: "redis:6379"
      REDIS_PASSWORD: ""
      REDIS_DB: "0"
      BACKEND_URL: "http://backend:8005"
      SCHEDULE_CHANNEL: "scheduler:new"
      STATUS_CHANNEL: "scheduler:status"
    depends_on:
      redis:
        condition: service_healthy

  frontend:
    image: ghcr.io/odutrajs/feedeo-frontend:latest
    restart: unless-stopped
    depends_on:
      - backend

  nginx:
    image: ghcr.io/odutrajs/feedeo-nginx:latest
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - certbot-conf:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    depends_on:
      - frontend
      - backend
      - scheduler

  certbot:
    image: certbot/certbot
    restart: unless-stopped
    volumes:
      - certbot-conf:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

volumes:
  postgres-data:
  redis-data:
  minio-data:
  storage-data:
  certbot-conf:
  certbot-www:
