services:
  minio:
    image: minio/minio:latest
    container_name: creators-minio
    command: server /data --console-address ":9001"
    # 9010/9011 no host para não conflitar com outros MinIO locais
    ports:
      - "9010:9000"
      - "9011:9001"
    environment:
      MINIO_ROOT_USER: creators
      MINIO_ROOT_PASSWORD: creators123
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: creators-redis
    ports:
      - "6380:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  scheduler:
    build:
      context: ./scheduler
      dockerfile: Dockerfile
    container_name: creators-scheduler
    ports:
      - "8090:8090"
    environment:
      HTTP_ADDR: ":8090"
      REDIS_ADDR: "redis:6379"
      REDIS_PASSWORD: ""
      REDIS_DB: "0"
      BACKEND_URL: "http://host.docker.internal:8005"
      SCHEDULE_CHANNEL: "scheduler:new"
      STATUS_CHANNEL: "scheduler:status"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  minio-data:
  redis-data:
