services:
  redis:
    image: redis:7-alpine
    container_name: creators-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: creators-scheduler
    ports:
      - "8090:8090"
    environment:
      HTTP_ADDR: ":8090"
      REDIS_ADDR: "redis:6379"
      REDIS_PASSWORD: ""
      REDIS_DB: "0"
      BACKEND_URL: "http://host.docker.internal:8005"
      SCHEDULE_CHANNEL: "scheduler:new"
      STATUS_CHANNEL: "scheduler:status"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redis-data:
